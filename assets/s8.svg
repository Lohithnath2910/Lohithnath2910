<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140" role="img" aria-label="8 CONTACT">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .blk{font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900}
.ink{fill:none;stroke:#141414;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.thin{fill:none;stroke:#141414;stroke-width:1.2}
.dsh{fill:none;stroke:#141414;stroke-width:1.2;stroke-dasharray:3 3}
.d{stroke-dasharray:1;animation:draw 1.5s cubic-bezier(.6,0,.2,1) both}
.f{animation:fade .5s ease-out both}
.drop{animation:drop .7s cubic-bezier(.3,1.3,.5,1) both}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.6,0,.2,1) both}
.wipe{transform-box:fill-box;transform-origin:0 50%;animation:wipe .8s cubic-bezier(.6,0,.2,1) both}
.slide{animation:slide 1.1s cubic-bezier(.3,1,.4,1) .3s both}
.lamp{animation:lamp 2.4s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes drop{from{transform:translateY(-18px);opacity:0}}
@keyframes grow{from{transform:scaleY(0)}} @keyframes wipe{from{transform:scaleX(0)}}
@keyframes slide{from{transform:translateX(-34px)}}
@keyframes lamp{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="6" y="6" width="894" height="134" fill="#141414"/>
<rect x="0" y="0" width="894" height="134" fill="#efebe1" stroke="#141414" stroke-width="3"/>
<rect x="0" y="0" width="76" height="134" fill="#2bb24c" stroke="#141414" stroke-width="3"/>
<text x="38" y="84" text-anchor="middle" class="blk" font-size="46" fill="#141414">8</text>
<text x="100" y="42" class="mono" font-size="11.5" fill="#6b665c" letter-spacing="1.6">PROCEDURE</text>
<text x="100" y="88" class="blk" font-size="30" fill="#141414" letter-spacing="-.5">CONTACT</text>
<line x1="100" y1="104" x2="560" y2="104" pathLength="1" class="thin d" style="animation-duration:1.2s"/>
<g transform="translate(606,19)"><g class="f"><rect x="160" y="14" width="72" height="68" rx="6" fill="#efebe1" stroke="#141414" stroke-width="2.2" /><rect x="176" y="34" width="14" height="6" fill="#141414"/><rect x="176" y="56" width="14" height="6" fill="#141414"/></g><circle cx="214" cy="26" r="4" fill="#2bb24c" class="lamp"/><g class="slide"><path d="M0 48 C 16 48 18 48 30 48" pathLength="1" class="ink d" style="animation-delay:0.10s"/><rect x="30" y="22" width="52" height="52" rx="5" fill="#ffd23f" stroke="#141414" stroke-width="2.2" /><rect x="40" y="32" width="32" height="32" fill="none" stroke="#141414" stroke-width="1.2"/><rect x="82" y="34" width="102" height="6" fill="#141414"/><rect x="82" y="56" width="102" height="6" fill="#141414"/></g><path d="M0 48 C 8 78 14 20 30 48" pathLength="1" class="ink d" style="animation-delay:0.20s" opacity="0"/></g>
</svg>