<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140" role="img" aria-label="2 EQUIPMENT">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .blk{font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900}
.ink{fill:none;stroke:#141414;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.thin{fill:none;stroke:#141414;stroke-width:1.2}
.dsh{fill:none;stroke:#141414;stroke-width:1.2;stroke-dasharray:3 3}
.d{stroke-dasharray:1;animation:draw 1.5s cubic-bezier(.6,0,.2,1) both}
.f{animation:fade .5s ease-out both}
.drop{animation:drop .7s cubic-bezier(.3,1.3,.5,1) both}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.6,0,.2,1) both}
.wipe{transform-box:fill-box;transform-origin:0 50%;animation:wipe .8s cubic-bezier(.6,0,.2,1) both}
.slide{animation:slide 1.1s cubic-bezier(.3,1,.4,1) .3s both}
.lamp{animation:lamp 2.4s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes drop{from{transform:translateY(-18px);opacity:0}}
@keyframes grow{from{transform:scaleY(0)}} @keyframes wipe{from{transform:scaleX(0)}}
@keyframes slide{from{transform:translateX(-34px)}}
@keyframes lamp{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
