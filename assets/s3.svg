<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140" role="img" aria-label="3 SERVICE RECORD">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .blk{font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900}
.ink{fill:none;stroke:#141414;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.thin{fill:none;stroke:#141414;stroke-width:1.2}
.dsh{fill:none;stroke:#141414;stroke-width:1.2;stroke-dasharray:3 3}
.d{stroke-dasharray:1;animation:draw 1.5s cubic-bezier(.6,0,.2,1) both}
.f{animation:fade .5s ease-out both}
.drop{animation:drop .7s cubic-bezier(.3,1.3,.5,1) both}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.6,0,.2,1) both}
.wipe{transform-box:fill-box;transform-origin:0 50%;animation:wipe .8s cubic-bezier(.6,0,.2,1) both}
.slide{animation:slide 1.1s cubic-bezier(.3,1,.4,1) .3s both}
.lamp{animation:lamp 2.4s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes drop{from{transform:translateY(-18px);opacity:0}}
@keyframes grow{from{transform:scaleY(0)}} @keyframes wipe{from{transform:scaleX(0)}}
@keyframes slide{from{transform:translateX(-34px)}}
@keyframes lamp{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="6" y="6" width="894" height="134" fill="#141414"/>
<rect x="0" y="0" width="894" height="134" fill="#efebe1" stroke="#141414" stroke-width="3"/>
<rect x="0" y="0" width="76" height="134" fill="#2d55e6" stroke="#141414" stroke-width="3"/>
<text x="38" y="84" text-anchor="middle" class="blk" font-size="46" fill="#efebe1">3</text>
<text x="100" y="42" class="mono" font-size="11.5" fill="#6b665c" letter-spacing="1.6">WORK HISTORY</text>
<text x="100" y="88" class="blk" font-size="26" fill="#141414" letter-spacing="-.5">SERVICE RECORD</text>
<line x1="100" y1="104" x2="560" y2="104" pathLength="1" class="thin d" style="animation-duration:1.2s"/>
<g transform="translate(606,19)"><g class="f"><rect x="8" y="10" width="114" height="78" rx="0" fill="#efebe1" stroke="#141414" stroke-width="2.2" /><rect x="122" y="10" width="114" height="78" rx="0" fill="#efebe1" stroke="#141414" stroke-width="2.2" /></g><line x1="20" y1="26" x2="110" y2="26" pathLength="1" class="ink d" style="animation-delay:0.30s"/><line x1="20" y1="38" x2="92" y2="38" pathLength="1" class="ink d" style="animation-delay:0.42s"/><line x1="20" y1="50" x2="110" y2="50" pathLength="1" class="ink d" style="animation-delay:0.54s"/><line x1="20" y1="62" x2="92" y2="62" pathLength="1" class="ink d" style="animation-delay:0.66s"/><line x1="20" y1="74" x2="110" y2="74" pathLength="1" class="ink d" style="animation-delay:0.78s"/><line x1="134" y1="26" x2="224" y2="26" pathLength="1" class="ink d" style="animation-delay:0.90s"/><line x1="134" y1="38" x2="202" y2="38" pathLength="1" class="ink d" style="animation-delay:1.02s"/><line x1="134" y1="50" x2="224" y2="50" pathLength="1" class="ink d" style="animation-delay:1.14s"/><g class="drop" style="animation-delay:1.3s"><circle cx="188" cy="66" r="17" fill="none" stroke="#2bb24c" stroke-width="3"/><circle cx="188" cy="66" r="12" fill="none" stroke="#2bb24c" stroke-width="1.2"/><text x="188" y="71" text-anchor="middle" class="blk" font-size="13" fill="#2bb24c">OK</text></g><path d="M96 10 V40 L104 33 L112 40 V10" fill="#2d55e6" stroke="#141414" stroke-width="2.2" class="f" style="animation-delay:.6s"/></g>
</svg>