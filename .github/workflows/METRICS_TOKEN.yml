# ─────────────────────────────────────────────────────────────
#  Profile Metrics
#  Renders a full infographic (isometric contribution calendar,
#  language breakdown, coding habits, achievements) and commits
#  it back to this repo as metrics.svg.
#
#  Requires a repo secret named METRICS_TOKEN.
#  See setup notes in the README of this gist/repo.
# ─────────────────────────────────────────────────────────────

name: Metrics

on:
  schedule:
    - cron: "0 18 * * *"        # daily, 23:30 IST
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    name: Render infographic
    runs-on: ubuntu-latest

    steps:
      - name: Overview panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: Lohithnath2910

          # ── appearance ──────────────────────────────────────
          template: classic
          base: header, activity, repositories
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes

          # ── isometric contribution calendar ────────────────
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ── language breakdown, weighted by real bytes ─────
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%

          # ── commit habits and active hours ─────────────────
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          # ── lifetime lines of code ─────────────────────────
          plugin_lines: yes
          plugin_lines_sections: base

          # ── GitHub achievements, compact ───────────────────
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
