name: Operating data

on:
  schedule:
    - cron: "0 * * * *"     # every hour, so TODAY stays current
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/operating_data.py"
      - ".github/workflows/operating-data.yml"

concurrency:
  group: operating-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw panels
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/operating_data.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live
          git diff --cached --quiet || git commit -m "chore: refresh operating data"
          git push
