# ─────────────────────────────────────────────────────────────
#  Contribution Snake
#  Renders the contribution graph as an animated SVG and pushes
#  it to the `output` branch. No secrets required.
# ─────────────────────────────────────────────────────────────

name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    name: Render animation
    runs-on: ubuntu-latest

    steps:
      - name: Generate SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=%23D71921&color_dots=%231C1C1C,%235a1010,%23901818,%23b81d1d,%23D71921

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
