# ─────────────────────────────────────────────────────────────
#  Contribution Snake
#  Renders the contribution graph as an animated SVG and pushes
#  it to the `output` branch. No personal token required.
# ─────────────────────────────────────────────────────────────

name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    name: Render animation
    runs-on: ubuntu-latest

    steps:
      - name: Generate SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#D71921&color_dots=#151515,#4a0f12,#8a1116,#b8161c,#D71921
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
